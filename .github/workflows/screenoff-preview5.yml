name: Build ScreenOff preview5

on:
  push:
    branches:
      - screenoff-preview5-build
    paths:
      - '.github/workflows/screenoff-preview5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct ScreenOff preview5 source
        run: |
          cat screenoff-preview5-min/m_* | base64 -d > /tmp/screenoff-preview5.tar.gz
          echo "5d8bfc36409a72aa047edcc0907cfe9608cb356396b0fe90262c1b46fd65457d  /tmp/screenoff-preview5.tar.gz" | sha256sum -c -
          mkdir -p /tmp/screenoff-preview5
          tar -xzf /tmp/screenoff-preview5.tar.gz -C /tmp/screenoff-preview5
          grep -q 'versionName "A17-preview5"' /tmp/screenoff-preview5/app/build.gradle

      - name: First APK build
        working-directory: /tmp/screenoff-preview5
        run: gradle :app:assembleDebug --stacktrace

      - name: Embed ScreenController dex
        working-directory: /tmp/screenoff-preview5
        run: |
          mkdir -p app/src/main/assets
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes.dex > app/src/main/assets/ScreenController.dex
          test -s app/src/main/assets/ScreenController.dex

      - name: Final APK build
        working-directory: /tmp/screenoff-preview5
        run: |
          gradle :app:clean :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ScreenOff-A17-preview5.apk"
          unzip -t "$GITHUB_WORKSPACE/ScreenOff-A17-preview5.apk"
          sha256sum "$GITHUB_WORKSPACE/ScreenOff-A17-preview5.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOff-A17-preview5
          path: ScreenOff-A17-preview5.apk
          if-no-files-found: error
          retention-days: 7
