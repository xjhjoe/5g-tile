name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace

      - name: Summarize regression tests
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          for key in ('tests', 'failures', 'errors', 'skipped'):
              print(key + ': ' + str(sum(int(s.get(key, 0)) for s in suites)))
          assert suites, 'No test results found'
          PY

      - name: Verify Shizuku manifest declarations
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "moe.shizuku.manager.permission.API_V23" /tmp/manifest.txt
          grep -q "moe.shizuku.client.V3_SUPPORT" /tmp/manifest.txt
          grep -q "rikka.shizuku.ShizukuProvider" /tmp/manifest.txt
          grep -q "com.example.fivegtile" /tmp/manifest.txt
          echo "Verified packaged APK contains Shizuku permission, V3 metadata and provider."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FiveGTile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
